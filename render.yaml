services:
  - type: web
    name: travel-ai-backend
    runtime: docker
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: ./apps/backend
    plan: starter
    region: frankfurt
    branch: main
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: travel-ai-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false   # Set manually in Render dashboard
      - key: DUFFEL_API_KEY
        sync: false   # Set manually in Render dashboard

databases:
  - name: travel-ai-db
    databaseName: travel_ai
    user: travel_user
    plan: free
    region: frankfurt
