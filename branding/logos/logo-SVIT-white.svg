<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140" width="400" height="140">
  <defs>
    <!-- Same S-Horizon gradients, preserved on any background -->
    <linearGradient id="tealArcW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="amberArcW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <filter id="dotGlowW" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .wordmark-white {
        font-family: 'SF Pro Display', 'Helvetica Neue', 'Arial', sans-serif;
        font-weight: 700;
        font-size: 54px;
        letter-spacing: 6px;
        fill: #FFFFFF;
      }
      .tagline-white {
        font-family: 'SF Pro Display', 'Helvetica Neue', 'Arial', sans-serif;
        font-weight: 400;
        font-size: 11px;
        letter-spacing: 4px;
        fill: #9CA3AF;
      }
    </style>
  </defs>

  <!-- Transparent background — works on dark photos, stories, overlays -->
  <rect width="400" height="140" fill="none"/>

  <!--
    S-HORIZON SYMBOL — same geometry as v2, same icon bounding box
    x=32..88, y=22..118, center=60,70
    Teal top arc + amber bottom arc + center waypoint dot
  -->

  <!-- Top arc of S — teal -->
  <path
    d="M 60 70
       C 82 70, 88 58, 88 46
       C 88 34, 82 22, 60 22
       C 46 22, 36 28, 33 35"
    fill="none"
    stroke="#14B8A6"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Bottom arc of S — amber -->
  <path
    d="M 60 70
       C 38 70, 32 82, 32 94
       C 32 106, 38 118, 60 118
       C 74 118, 84 112, 87 105"
    fill="none"
    stroke="#F59E0B"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Center waypoint dot -->
  <circle cx="60" cy="70" r="6" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.3" filter="url(#dotGlowW)"/>
  <circle cx="60" cy="70" r="3.5" fill="#F59E0B" filter="url(#dotGlowW)"/>
  <circle cx="60" cy="67" r="1.5" fill="#14B8A6" opacity="0.9"/>

  <!-- Vertical separator -->
  <line x1="110" y1="38" x2="110" y2="102" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- SVIT wordmark — white -->
  <text x="130" y="97" class="wordmark-white">SVIT</text>

  <!-- AI TRAVEL tagline — muted grey -->
  <text x="132" y="116" class="tagline-white">AI TRAVEL</text>

</svg>
