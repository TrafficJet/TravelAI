<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <style>
      .brand-name {
        font-family: 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 700;
        font-size: 42px;
        letter-spacing: -1px;
        fill: #F4F4F8;
      }
      .brand-tagline {
        font-family: 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 400;
        font-size: 13px;
        letter-spacing: 2px;
        fill: #6B7280;
        text-transform: uppercase;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="400" height="200" fill="#0A0A14"/>

  <!-- Icon: M formed by two mountain peaks -->
  <!-- Mountain silhouette / stylized M -->
  <!-- Left slope up -->
  <polyline
    points="18,138 45,68 72,108 99,68 118,138"
    fill="none"
    stroke="#14B8A6"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Snow cap left peak -->
  <polyline
    points="38,82 45,68 52,82"
    fill="none"
    stroke="#F59E0B"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Snow cap right peak -->
  <polyline
    points="92,82 99,68 106,82"
    fill="none"
    stroke="#F59E0B"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Compass rose — minimal circle below peaks -->
  <circle cx="68" cy="155" r="10" fill="none" stroke="#F59E0B" stroke-width="1.5" opacity="0.5"/>
  <line x1="68" y1="148" x2="68" y2="145" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  <line x1="68" y1="162" x2="68" y2="165" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="61" y1="155" x2="58" y2="155" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="75" y1="155" x2="78" y2="155" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="68" cy="155" r="2" fill="#F59E0B"/>

  <!-- Vertical divider -->
  <line x1="128" y1="60" x2="128" y2="140" stroke="#1E2030" stroke-width="1"/>

  <!-- Brand name -->
  <text x="148" y="118" class="brand-name">MANDRY</text>

  <!-- Tagline -->
  <text x="150" y="143" class="brand-tagline">discover adventures</text>
</svg>
