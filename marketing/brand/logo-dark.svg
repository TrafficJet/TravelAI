<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" fill="none" width="280" height="80">
  <!--
    SVIT — Full Lockup Dark Version
    White on dark/transparent. Use on dark backgrounds.
    Version: 1.0 | May 2026
  -->

  <!-- Dark background (remove if compositing over existing dark surface) -->
  <rect width="280" height="80" fill="#0E0E18" rx="8"/>

  <!-- ─── Symbol ─── -->

  <!-- Outer compass ring — white -->
  <circle cx="40" cy="40" r="34" stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.92"/>
  <!-- Inner ring -->
  <circle cx="40" cy="40" r="22" stroke="#FFFFFF" stroke-width="0.75" fill="none" opacity="0.18"/>

  <!-- Cardinal ticks — white -->
  <line x1="40" y1="6"  x2="40" y2="14" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" opacity="0.92"/>
  <line x1="40" y1="66" x2="40" y2="74" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" opacity="0.92"/>
  <line x1="6"  y1="40" x2="14" y2="40" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" opacity="0.92"/>
  <line x1="66" y1="40" x2="74" y2="40" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" opacity="0.92"/>

  <!-- Diagonal ticks -->
  <line x1="63.9" y1="16.1" x2="58.8" y2="21.2" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" opacity="0.3"/>
  <line x1="16.1" y1="16.1" x2="21.2" y2="21.2" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" opacity="0.3"/>
  <line x1="63.9" y1="63.9" x2="58.8" y2="58.8" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" opacity="0.3"/>
  <line x1="16.1" y1="63.9" x2="21.2" y2="58.8" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" opacity="0.3"/>

  <!-- S-needle — brand gold accent on dark background -->
  <!-- Upper lobe -->
  <path d="M 40 40 C 40 29 50 28 50 21 C 50 14 40 14 40 19"
        stroke="#E8A020" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  <!-- Lower lobe -->
  <path d="M 40 40 C 40 51 30 52 30 59 C 30 66 40 66 40 61"
        stroke="#E8A020" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  <!-- Center dot — gold -->
  <circle cx="40" cy="40" r="3" fill="#E8A020"/>

  <!-- ─── Wordmark — white ─── -->
  <text
    x="96"
    y="46"
    font-family="'Geist', 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif"
    font-size="36"
    font-weight="700"
    letter-spacing="-0.5"
    fill="#FFFFFF">SVIT</text>

  <!-- Tagline — muted white -->
  <text
    x="98"
    y="62"
    font-family="'Geist', 'SF Pro Text', -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="9"
    font-weight="500"
    letter-spacing="3.8"
    fill="rgba(255,255,255,0.4)">AI TRAVEL</text>

  <!-- Accent rule — gold -->
  <line x1="97" y1="67" x2="226" y2="67" stroke="#E8A020" stroke-width="1" opacity="0.6"/>
</svg>
