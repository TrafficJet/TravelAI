<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none" width="80" height="80">
  <!--
    SVIT — Abstract Symbol (Standalone)
    Compass + S-letterform. Monochrome black on white.
    Version: 1.0 | May 2026
  -->

  <!-- Outer compass ring -->
  <circle cx="40" cy="40" r="34" stroke="#1A1A1A" stroke-width="2" fill="none"/>

  <!-- Inner ring (subtle) -->
  <circle cx="40" cy="40" r="22" stroke="#1A1A1A" stroke-width="0.75" fill="none" opacity="0.2"/>

  <!-- Cardinal tick marks — N, S, E, W -->
  <line x1="40" y1="6"  x2="40" y2="14" stroke="#1A1A1A" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="40" y1="66" x2="40" y2="74" stroke="#1A1A1A" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="6"  y1="40" x2="14" y2="40" stroke="#1A1A1A" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="66" y1="40" x2="74" y2="40" stroke="#1A1A1A" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Diagonal tick marks — NE, NW, SE, SW -->
  <line x1="63.9" y1="16.1" x2="58.8" y2="21.2" stroke="#1A1A1A" stroke-width="1.1" stroke-linecap="round" opacity="0.38"/>
  <line x1="16.1" y1="16.1" x2="21.2" y2="21.2" stroke="#1A1A1A" stroke-width="1.1" stroke-linecap="round" opacity="0.38"/>
  <line x1="63.9" y1="63.9" x2="58.8" y2="58.8" stroke="#1A1A1A" stroke-width="1.1" stroke-linecap="round" opacity="0.38"/>
  <line x1="16.1" y1="63.9" x2="21.2" y2="58.8" stroke="#1A1A1A" stroke-width="1.1" stroke-linecap="round" opacity="0.38"/>

  <!--
    S-needle: two Bezier curves forming the letter S
    Upper lobe: curves right and upward from center
    Lower lobe: curves left and downward from center
  -->
  <!-- Upper lobe of S -->
  <path d="M 40 40 C 40 29 50 28 50 21 C 50 14 40 14 40 19"
        stroke="#1A1A1A" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Lower lobe of S -->
  <path d="M 40 40 C 40 51 30 52 30 59 C 30 66 40 66 40 61"
        stroke="#1A1A1A" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Center pivot dot -->
  <circle cx="40" cy="40" r="3" fill="#1A1A1A"/>
</svg>
