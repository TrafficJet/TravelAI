name: Deploy to Railway

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        # IMPORTANT: run from repo root so railway.toml rootDirectory="apps/backend" resolves correctly.
        # Running from apps/backend/ causes the builder to look for apps/backend/ inside the already-scoped
        # snapshot and fail with "no such file or directory".
        run: railway up --service travel-ai-backend --detach
