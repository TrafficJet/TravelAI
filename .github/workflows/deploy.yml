name: deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/travel-ai-backend

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Lint & type-check
  # ─────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

  # ─────────────────────────────────────────────
  # Job 2: Tests
  # ─────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: apps/backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: travel_user
          POSTGRES_PASSWORD: travel_pass_ci
          POSTGRES_DB: travel_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://travel_user:travel_pass_ci@localhost:5432/travel_ai_test
      JWT_ACCESS_SECRET: ci-access-secret-min-32-chars-long-x
      JWT_REFRESH_SECRET: ci-refresh-secret-min-32-chars-long-x
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # DUFFEL_API_KEY intentionally omitted — tests must run in mock mode.
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run migrations (test DB)
        run: npx prisma migrate deploy

      - name: Run tests
        run: npm test

  # ─────────────────────────────────────────────
  # Job 3: Build Docker image
  # ─────────────────────────────────────────────
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    # Only build on push to main (not on PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=true

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./apps/backend
          dockerfile: ./apps/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # Job 4: Deploy to Railway
  # ─────────────────────────────────────────────
  deploy-railway:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production
      url: ${{ vars.RAILWAY_PUBLIC_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Trigger redeploy via Railway GraphQL API (Account Token → Authorization: Bearer).
      # railway CLI requires a Project Token (RAILWAY_TOKEN), but we have an Account Token,
      # which must be used as RAILWAY_API_TOKEN for CLI or as a Bearer header for the API.
      # Using the API directly avoids the CLI auth mismatch entirely.
      #
      # We retry up to 3 times with a 15-second gap to avoid being dropped due to
      # a concurrent build that Railway may already have in flight from a previous push.
      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            echo "Deploy attempt ${attempt}..."
            RESPONSE=$(curl -sf -X POST https://backboard.railway.app/graphql/v2 \
              -H "Authorization: Bearer ${RAILWAY_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{
                "query": "mutation { serviceInstanceRedeploy(serviceId: \"9b7ed984-302f-4713-aed0-442452c53f9a\", environmentId: \"4e70a63d-d982-4f87-8be4-210c7a8aa0fa\") }"
              }' 2>&1 || echo '{"error":"curl_failed"}')
            echo "Railway API response: ${RESPONSE}"
            if echo "${RESPONSE}" | grep -q '"serviceInstanceRedeploy":true'; then
              echo "Redeploy triggered successfully on attempt ${attempt}."
              exit 0
            fi
            echo "Attempt ${attempt} did not confirm redeploy. Waiting 15s before retry..."
            sleep 15
          done
          echo "All redeploy attempts exhausted — last response above."
          exit 1

# ─────────────────────────────────────────────
# Required repository secrets:
#
#   RAILWAY_TOKEN       — Railway Account Token (Account Settings > Tokens).
#                         Used as Bearer token in GraphQL API calls.
#                         Service ID: 9b7ed984-302f-4713-aed0-442452c53f9a
#                         Environment ID: 4e70a63d-d982-4f87-8be4-210c7a8aa0fa
#   ANTHROPIC_API_KEY   — Anthropic API key (used in CI tests)
#   DUFFEL_API_KEY      — Duffel flights API key (production only, NOT used in CI)
#
# Required repository variables:
#   RAILWAY_PUBLIC_URL  — Public URL of the deployed service (for environment link)
# ─────────────────────────────────────────────
