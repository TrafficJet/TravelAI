version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: travel_ai_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: travel_user
      POSTGRES_PASSWORD: travel_pass_2024
      POSTGRES_DB: travel_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
